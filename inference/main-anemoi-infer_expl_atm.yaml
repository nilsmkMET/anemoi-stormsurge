date: 2013-01-01 #specifies the reference date of the forecast (the starting date)

lead_time: 24h # specifies the forecast lead time in hours
# lead_time: 8736h # specifies the forecast lead time in hours

# device: cpu
# runner: parallel # run across multiple gpus
# runner: cutout

# input: test # use the dataset that was used during training as input. test (default), training or validation

# You can also provide a full dataset specification as follows:
# (e.g. as done in training)
#input:
#  dataset:
#    cutout:
#      - dataset: ...

input:
  dataset:
    join:
      - dataset: /lustre/storeB/users/nilsmk/anemoi-datasets/input/nordic4_surge_ocean_1980-2022.zarr
        frequency: 1h
      - dataset: /lustre/storeB/users/nilsmk/anemoi-datasets/input/nordic4_surge_atmos_1980-2022.zarr
        frequency: 1h
    adjust: ["start", "end"]

#output:
#  netcdf: /pfs/lustrep3/scratch/project_465001902/experiments/lam-gridind-res10-2024-cloud/inference/full-reset.nc

